const PA={home:'M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z',batch:'M2 22V10l7-3v3l5-3v3l5-3V4h3v18H2z',resep:'M21 5c-1.1-.35-2.3-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1z',bahan:'M20 2H4c-1 0-2 .9-2 2v3.01c0 .72.43 1.34 1 1.69V20c0 1.1 1.1 2 2 2h14c.9 0 2-.9 2-2V8.7c.57-.35 1-.97 1-1.69V4c0-1.1-1-2-2-2zm-5 12H9v-2h6v2zm5-7H4V4h16v3z',scan:'M3 11h8V3H3v8zm2-6h4v4H5V5zM3 21h8v-8H3v8zm2-6h4v4H5v-4zM13 3v8h8V3h-8zm6 6h-4V5h4v4zM13 13h2v2h-2zM15 15h2v2h-2zM13 17h2v2h-2zM17 13h2v2h-2zM19 15h2v2h-2zM17 17h2v2h-2zM19 19h2v2h-2zM15 19h2v2h-2z',set:'M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.6 3.6 0 0112 15.6z',add:'M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z',logout:'M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z'};

PA.home='M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z';
function shell(h){$('#app').innerHTML=`<header><span>${TT[T]}</span><button class=ib title="Keluar" aria-label="Keluar" onclick="sessionStorage.clear();location.reload()">${ic('logout')}</button></header><main>${h}</main><nav>${Object.keys(NM).map(k=>`<button class="${T==k?'on':''}" onclick="go('${k}')"><i>${ic(IC[k])}</i>${NM[k]}</button>`).join('')}</nav>`}

async function go(t){T=t;if(t!='set')await run(load);V[t]()}
// ---------- Login
function login(){$('#app').innerHTML=`<main style="max-width:340px;margin-top:12vh"><div class=card><h3>Masuk ke CIBLE Produksi</h3><label>Username<input id=lu autocomplete=username></label><label>Password<input id=lp type=password autocomplete=current-password onkeydown="if(event.key=='Enter')masuk()"></label><button onclick=masuk()>Masuk</button></div></main>`}
function masuk(){if($('#lu').value.trim()=='admin'&&$('#lp').value=='1234'){sessionStorage.ok=1;go('home')}else toast('Username atau password salah')}
// ---------- Views
const V={};
V.batch=()=>shell(`${D.Produksi.length?[...D.Produksi].reverse().map(b=>`<div class=li onclick="det('${b.Kode}')"><div><b>${H(b.NamaProduk)}</b><small>${b.Kode} · ${b.TglProduksi}</small></div><div style="text-align:right"><span class="chip ${b.Status}">${b.Status}</span>${b.HPP?`<br><small>HPP ${rp(b.HPP)}</small>`:''}</div></div>`).join(''):'<p class=card>Belum ada batch. Tekan Batch baru untuk memulai.</p>'}<a class=fab onclick=baru()>${ic('add')}Batch baru</a>`);
function baru(){shell(`<div class=card><h3>Batch baru</h3><label>Produk<select id=bp onchange=hit()>${D.Produk.map(p=>`<option value="${H(p.Kode)}">${H(p.Kode)} - ${H(p.Nama)}</option>`)}</select></label><div class=row><label>Jumlah rencana (unit)<input id=bq type=number value=10 oninput=hit()></label><label>Tanggal produksi<input id=bt type=date value="${today()}"></label></div><label>Operator<input id=bo></label><div id=bi></div><button onclick=mulai()>Mulai &amp; ambil bahan</button><button class=g onclick="go('batch')">Batal</button></div>`);hit()}
function hit(){const r=D.Resep.find(x=>x.KodeProduk==$('#bp').value),q=+$('#bq').value||0;
 if(!r){S.it=[];$('#bi').innerHTML='<p class=w>Resep produk ini belum dibuat (menu Resep).</p>';return}
 const f=q/(+r.YieldStandar||1);S.r=r;S.it=JSON.parse(r.Item||'[]').map(i=>({...i,q:+(i.Basis=='Unit'?i.Qty*q:i.Qty*f).toFixed(3)}));
 $('#bi').innerHTML=`<table><tr><th>Bahan</th><th>Ambil</th><th>Stok</th><th>Est. biaya</th></tr>${S.it.map((i,k)=>{const b=B(i.BarangID);return`<tr><td>${H(i.Nama)}</td><td><input id=q${k} type=number step=any value=${i.q}> ${H(i.Satuan)}</td><td class="${b.Jumlah<i.q?'w':''}">${b.Jumlah??'?'}</td><td>${rp(i.q*b.HargaSatuan)}</td></tr>`}).join('')}</table>`}
const mulai=()=>run(async()=>{const r=await api('prod.mulai',{KodeProduk:$('#bp').value,QtyRencana:$('#bq').value,TglProduksi:$('#bt').value,Operator:$('#bo').value,Items:S.it.map((i,k)=>({BarangID:i.BarangID,Qty:$('#q'+k).value}))});toast('Batch '+r.Kode+' dimulai');await load();det(r.Kode)});
function det(k){const b=D.Produksi.find(x=>x.Kode==k);if(!b)return toast('Kode tidak ditemukan');const bh=D.ProduksiBahan.filter(x=>x.Kode==k),p=D.Produk.find(x=>x.Kode==b.KodeProduk)||{},r=D.Resep.find(x=>x.KodeProduk==b.KodeProduk)||{};
 const fin=b.Status=='Proses'?`<div class=card><h3>Selesaikan batch</h3><div class=row><label>Jumlah jadi<input id=fj type=number step=any value=${b.QtyRencana}></label><label>Reject<input id=fr type=number value=0></label></div><div class=row><label>Biaya tenaga kerja<input id=ft type=number value=${r.BiayaTK||0}></label><label>Overhead<input id=fo type=number value=${r.BiayaOverhead||0}></label></div><label>Exp date<input id=fe type=date value="${b.ExpDate}"></label><p>Isi sisa bahan yang dikembalikan ke persediaan pada kolom Kembali.</p><button onclick="selesai('${k}')">Simpan hasil &amp; hitung HPP</button></div>`:'';

 shell(`<button class=g onclick="go('batch')">‹ Kembali</button><div class=card><h3>${b.Kode} <span class="chip ${b.Status}">${b.Status}</span></h3>${H(b.NamaProduk)}<br>Produksi ${b.TglProduksi} · Exp ${b.ExpDate} · Rencana ${b.QtyRencana}${b.QtyJadi?` · Jadi ${b.QtyJadi} · Reject ${b.QtyReject}`:''}${b.Operator?' · '+H(b.Operator):''}</div>
 <table><tr><th>Bahan</th><th>Diambil</th><th>Kembali</th><th>Harga</th><th>Biaya</th></tr>${bh.map(x=>`<tr><td>${H(x.Nama)}</td><td>${x.Qty} ${H(x.Satuan)}</td><td>${b.Status=='Proses'?`<input class=kb data-id="${x.BarangID}" type=number step=any value=0>`:x.Kembali}</td><td>${rp(x.HargaSatuan)}</td><td>${rp(x.Biaya)}</td></tr>`).join('')}</table>${fin}${hpp}<button class=g onclick="btStruk('${k}')">Cetak struk via Bluetooth</button>${b.Status!='Batal'?`<button class=r onclick="batal('${k}')">Batalkan batch</button>`:''}`)}
const selesai=k=>run(async()=>{await api('prod.selesai',{Kode:k,QtyJadi:$('#fj').value,QtyReject:$('#fr').value,BiayaTK:$('#ft').value,BiayaOverhead:$('#fo').value,ExpDate:$('#fe').value,Kembali:[...document.querySelectorAll('.kb')].map(i=>({BarangID:i.dataset.id,Kembali:i.value}))});await load();toast('Batch selesai, stok produk bertambah');det(k)});

function cetak(k){const b=D.Produksi.find(x=>x.Kode==k),n=Math.min(+$('#ln').value||1,500),m=$('#lm').value,w=C.lw||50,h=C.lh||30,u=(C.pub||(window.CONFIG&&CONFIG.PUBLIC_URL)||location.href.split('#')[0])+'#lacak='+k;
 $('#ps').textContent=`@page{size:${w}mm ${h}mm;margin:0}.lb{width:${w}mm;height:${h}mm}`;

 if(m!='b'){if(window.qrcode){const q=qrcode(0,'M');q.addData(u);q.make();document.querySelectorAll('.qr').forEach(e=>e.innerHTML=q.createSvgTag(2,0))}else toast('Library QR gagal dimuat (cek internet)')}
 if(m=='b'){pr.style.cssText='display:block;visibility:hidden;position:absolute;left:0;top:0';document.querySelectorAll('.one').forEach(e=>{let f=8;e.style.fontSize=f+'px';while(e.scrollWidth>e.clientWidth&&f>3){f-=.25;e.style.fontSize=f+'px'}});pr.style.cssText=''}
 setTimeout(()=>print(),200)}
V.resep=()=>{if(!R.k)R.k=(D.Produk[0]||{}).Kode;const r=D.Resep.find(x=>x.KodeProduk==R.k)||{};if(R.loaded!=R.k){R.items=JSON.parse(r.Item||'[]');R.loaded=R.k}
 shell(`<div class=card><label>Produk<select onchange="R.k=this.value;V.resep()">${D.Produk.map(p=>`<option value="${H(p.Kode)}" ${p.Kode==R.k?'selected':''}>${H(p.Kode)} - ${H(p.Nama)}</option>`)}</select></label>
 <div class=row><label>Umur simpan (hari)<input id=ru type=number value=${r.UmurSimpanHari||30}></label><label>Hasil standar / batch (unit)<input id=ry type=number value=${r.YieldStandar||10}></label></div>
 <div class=row><label>Biaya tenaga kerja / batch<input id=rt type=number value=${r.BiayaTK||0}></label><label>Overhead / batch<input id=ro type=number value=${r.BiayaOverhead||0}></label></div>
 <table><tr><th>Bahan / kemasan</th><th>Jumlah</th><th>Dihitung</th><th></th></tr>${R.items.map((i,k)=>`<tr><td>${H(i.Nama)}</td><td><input type=number step=any value=${i.Qty} onchange="R.items[${k}].Qty=+this.value"> ${H(i.Satuan)}</td><td><select onchange="R.items[${k}].Basis=this.value"><option value=Batch ${i.Basis!='Unit'?'selected':''}>per batch</option><option value=Unit ${i.Basis=='Unit'?'selected':''}>per unit jadi</option></select></td><td><a onclick="R.items.splice(${k},1);V.resep()">✕</a></td></tr>`).join('')}</table>
 <label>Tambah item<select id=ri onchange="tambahItem()"><option value="">- pilih -</option>${D.Barang.map(b=>`<option value="${b.ID}">${H(b.Kategori)}: ${H(b.Nama)}</option>`)}</select></label><button onclick=simpanResep()>Simpan resep</button></div>`)};
function tambahItem(){const b=B($('#ri').value);if(!b.ID)return;R.items.push({BarangID:b.ID,Nama:b.Nama,Satuan:b.Satuan,Qty:1,Basis:b.Kategori=='Kemasan'?'Unit':'Batch'});V.resep()}
const simpanResep=()=>run(async()=>{await api('prod.simpanResep',{KodeProduk:R.k,UmurSimpanHari:$('#ru').value,YieldStandar:$('#ry').value,BiayaTK:$('#rt').value,BiayaOverhead:$('#ro').value,Item:R.items});R.loaded=null;await load();toast('Resep tersimpan');V.resep()});
V.home=()=>{const P=S.p||'m',ym=today().slice(0,7),d0=new Date(Date.now()-30*864e5).toLocaleDateString('sv-SE'),L=D.Produksi.filter(x=>x.Status=='Selesai'&&(P=='a'||(P=='m'?String(x.TglProduksi).startsWith(ym):x.TglProduksi>=d0))),sum=k=>L.reduce((a,x)=>a+(+x[k]||0),0),jadi=sum('QtyJadi'),rej=sum('QtyReject'),pr=D.Produksi.filter(x=>x.Status=='Proses'),pp={};
 L.forEach(x=>{const o=pp[x.KodeProduk]=pp[x.KodeProduk]||{n:x.NamaProduk,b:0,j:0,r:0,c:0};o.b++;o.j+=+x.QtyJadi||0;o.r+=+x.QtyReject||0;o.c+=+x.TotalBiaya||0});
 shell(`<label>Periode<select onchange="S.p=this.value;V.home()">${[['m','Bulan ini'],['t','30 hari terakhir'],['a','Semua']].map(([k,v])=>`<option value=${k} ${k==P?'selected':''}>${v}</option>`).join('')}</select></label>
 <div class=stats>${[['Batch selesai',L.length],['Produk jadi',jadi],['Total biaya',rp(sum('TotalBiaya'))],['Reject',(jadi+rej?Math.round(rej/(jadi+rej)*100):0)+'%']].map(([a,b])=>`<div class=card><small>${a}</small><div class=big>${b}</div></div>`).join('')}</div>
 ${pr.length?`<h3>Sedang berjalan</h3>${pr.map(b=>`<div class=li onclick="det('${b.Kode}')"><div><b>${H(b.NamaProduk)}</b><small>${b.Kode} · rencana ${b.QtyRencana}</small></div><span class="chip Proses">Proses</span></div>`).join('')}`:''}
 <h3>Hasil per produk</h3>${Object.keys(pp).length?`<table><tr><th>Produk</th><th>Batch</th><th>Jadi</th><th>Reject</th><th>HPP rata-rata</th></tr>${Object.values(pp).map(o=>`<tr><td>${H(o.n)}</td><td>${o.b}</td><td>${o.j}</td><td>${o.r}</td><td>${rp(o.c/(o.j||1))}</td></tr>`).join('')}</table>`:'<p class=card>Belum ada batch selesai pada periode ini.</p>'}
 <h3>Stok produk jadi</h3>${D.Produk.map(p=>`<div class=li><div><b>${H(p.Nama)}</b><small>${H(p.Kode)}${p.Retur?' · retur '+p.Retur:''}</small></div><b class="${+p.Stok>0?'ok':'no'}">${+p.Stok||0}</b></div>`).join('')}`)};
const kebutuhan=()=>{const m={};D.Resep.forEach(r=>JSON.parse(r.Item||'[]').forEach(i=>{const q=i.Basis=='Unit'?i.Qty*r.YieldStandar:i.Qty;m[i.BarangID]=Math.max(m[i.BarangID]||0,q)}));return m};
V.bahan=()=>{shell(`<label>Cari<input id=bs type=search placeholder="Cari bahan atau kemasan" value="${H(S.q||'')}" oninput="S.q=this.value;fb()"></label><div id=bl></div><a class=fab onclick=barangBaru()>${ic('add')}Barang baru</a>`);fb()};
function fb(){const q=(S.q||'').toLowerCase(),kb=kebutuhan(),L=D.Barang.filter(b=>b.Kategori!='Produk Jadi'&&(b.Nama+' '+b.Kategori).toLowerCase().includes(q));
 $('#bl').innerHTML=(L.length?L.map(b=>{const j=+b.Jumlah||0,c=j<=0?'no':j<(kb[b.ID]||0)?'lo':'ok';return`<div class=li><div><b>${H(b.Nama)}</b><small>${H(b.Kategori)} · ${rp(b.HargaSatuan)}/${H(b.Satuan)}</small></div><div style="text-align:right"><b class="${c}">${j} ${H(b.Satuan)}</b><br><small>${j<=0?'Habis':c=='lo'?'Menipis':'Tersedia'}</small></div><button class=t onclick="terima('${b.ID}')">Terima</button></div>`}).join(''):'<p class=card>Tidak ada barang yang cocok.</p>')+'<p><small><span class=ok>Hijau</span> cukup · <span class=lo>oranye</span> kurang dari kebutuhan satu batch · <span class=no>merah</span> habis</small></p>'}
const terima=async id=>{const b=B(id),v=await ask('Terima '+H(b.Nama),[['Jumlah ('+b.Satuan+')','','type=number step=any'],['Harga beli per '+b.Satuan+' (Rp)','','type=number']]);if(v)run(async()=>{await api('prod.terimaBahan',{ID:id,Qty:v[0],Harga:v[1]});await load();V.bahan();toast('Stok diperbarui (harga rata-rata tertimbang)')})};
const barangBaru=async()=>{const v=await ask('Barang baru',[['Nama'],['Kategori (Bahan Baku, Bahan Pembantu, Kemasan)','Bahan Baku'],['Satuan','kg']]);if(v)run(async()=>{await api('saveBarang',{Nama:v[0],Kategori:v[1],Satuan:v[2],Jumlah:0,HargaSatuan:0});await load();V.bahan()})};
V.scan=()=>shell(`<div class=card><label>Scan barcode atau ketik kode produksi<input id=sk onkeydown="if(event.key=='Enter')det(this.value.trim())" autofocus></label><button onclick="det($('#sk').value.trim())">Cari</button>${window.BarcodeDetector?'<button class=g onclick=kam()>Kamera</button>':''}<video id=vd hidden playsinline style="width:100%"></video></div>`);
async function kam(){const v=$('#vd'),st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}),d=new BarcodeDetector();v.hidden=false;v.srcObject=st;await v.play();
 const t=setInterval(async()=>{const r=await d.detect(v).catch(()=>[]);if(r.length){clearInterval(t);st.getTracks().forEach(x=>x.stop());let c=r[0].rawValue;const m=c.match(/lacak=([^&]+)/);det(m?decodeURIComponent(m[1]):c)}},400)}
V.set=()=>shell(`<div class=card><h3>Setelan</h3><label>URL web app Apps Script (kosongkan untuk memakai config.js)<input id=su value="${H(C.url||'')}" placeholder="${H(DEFAULT_URL)}"></label><label>PIN aplikasi (APP_PIN)<input id=sp type=password value="${H(C.pin||'')}"></label><div class=row><label>Lebar label (mm)<input id=sw type=number value=${C.lw||50}></label><label>Tinggi label (mm)<input id=sh type=number value=${C.lh||30}></label></div><label>URL publik aplikasi ini (untuk isi QR)<input id=sb placeholder="https://..." value="${H(C.pub||'')}"></label><div class=row><label>Chunk Bluetooth (byte)<input id=sc type=number value=${C.bch||20}></label><label>Jeda (ms)<input id=sd type=number value=${C.bdl||25}></label></div><label>Lebar cetak QR Bluetooth (dot, 58mm = 384)<input id=sx type=number value=${C.bpx||384}></label><button onclick=simpanSet()>Simpan</button></div><div class=card><h3>Printer Bluetooth</h3><p>${BT.dev?(BT.dev.gatt.connected?'Terhubung: ':'Terputus (menyambung ulang saat cetak): ')+H(BT.dev.name||'printer'):'Belum ada printer dipilih.'}</p><button onclick=btConn()>Pilih / sambungkan printer</button><button class=g onclick=btTest()>Cetak tes</button><p><small>Perlu HTTPS dan printer BLE. Naikkan chunk ke 100-180 jika ingin lebih cepat; turunkan jika hasil cetak berantakan.</small></p></div>${S.ip?'<div class=card><h3>Pasang aplikasi</h3><p>Pasang di perangkat ini agar terbuka seperti aplikasi biasa.</p><button onclick=pasang()>Pasang aplikasi</button></div>':''}`);
function simpanSet(){Object.assign(C,{url:$('#su').value.trim(),pin:$('#sp').value,lw:+$('#sw').value,lh:+$('#sh').value,pub:$('#sb').value.trim(),bch:+$('#sc').value||20,bdl:+$('#sd').value||25,bpx:+$('#sx').value||384});save();toast('Tersimpan')}
// ---------- Printer Bluetooth (ESC/POS via Web Bluetooth GATT, BLE)
const BT_UUID=['000018f0-0000-1000-8000-00805f9b34fb','0000ffe0-0000-1000-8000-00805f9b34fb','0000ff00-0000-1000-8000-00805f9b34fb','49535343-fe7d-4ae5-8fa9-9fafd205e455','e7810a71-73ae-499d-8c15-faa9aef0c3f2'];
const BT={dev:null,ch:null,
 async find(s){const ok=c=>c.properties.write||c.properties.writeWithoutResponse;
  for(const u of BT_UUID){try{const c=(await(await s.getPrimaryService(u)).getCharacteristics()).find(ok);if(c)return c}catch{}}
  try{for(const v of await s.getPrimaryServices()){const c=(await v.getCharacteristics().catch(()=>[])).find(ok);if(c)return c}}catch{}
  return null},
 async conn(pick){
  if(!navigator.bluetooth)throw Error('Web Bluetooth tidak didukung. Gunakan Chrome (Android/desktop).');
  if(!isSecureContext)throw Error('Web Bluetooth butuh HTTPS (atau localhost).');
  if(!pick&&BT.ch&&BT.dev.gatt.connected)return BT.ch;
  if(pick||!BT.dev){
   if(BT.dev?.gatt.connected)BT.dev.gatt.disconnect();
   BT.ch=null;
   BT.dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:BT_UUID});
   BT.dev.addEventListener('gattserverdisconnected',()=>{BT.ch=null})}
  const s=await BT.dev.gatt.connect();
  BT.ch=await BT.find(s);
  if(!BT.ch){s.disconnect();throw Error('Jalur tulis printer tidak ditemukan. Printer mungkin Bluetooth Classic (bukan BLE) atau memakai UUID lain.')}
  return BT.ch},
 async send(d){const ch=await BT.conn(),n=C.bch||20,w=ch.properties.writeWithoutResponse;
  for(let i=0;i<d.length;i+=n){const p=d.slice(i,i+n);if(w)await ch.writeValueWithoutResponse(p);else await ch.writeValue(p);await new Promise(r=>setTimeout(r,C.bdl||25))}}};
const ASC=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E\n]/g,'?'),
 cat=(...a)=>{const o=[];for(const x of a)typeof x=='string'?o.push(...new TextEncoder().encode(ASC(x))):o.push(...x);return new Uint8Array(o)},
 INIT=[27,64],CTR=[27,97,1],LFT=[27,97,0],BON=[27,69,1],BOFF=[27,69,0],BIG=[29,33,17],NRM=[29,33,0],FEED=n=>[27,100,n],
 row=(l,r)=>{l=ASC(l);r=ASC(r);return l.slice(0,Math.max(1,31-r.length)).padEnd(Math.max(1,32-r.length),' ')+r+'\n'},
 DASH='-'.repeat(32)+'\n',
 bcm=k=>{const d=[...new TextEncoder().encode('{B'+ASC(k))];return[29,104,60,29,119,k.length>12?1:2,29,72,0,29,107,73,d.length,...d,10]},
 qrm=u=>{const d=[...new TextEncoder().encode(u)],n=d.length+3;return[29,40,107,4,0,49,65,50,0,29,40,107,3,0,49,67,5,29,40,107,3,0,49,69,49,29,40,107,n&255,n>>8,49,80,48,...d,29,40,107,3,0,49,81,48]};
const oneLine=b=>{const n=ASC(b.NamaProduk),p=b.TglProduksi,e=b.ExpDate,f=`${n} Prod ${p} Exp ${e}`;
 if(f.length<=32)return cat(f+'\n');
 if(f.length<=42)return cat([27,77,1],f+'\n',[27,77,0]);
 const sd=d=>/^\d{4}-\d\d-\d\d/.test(d)?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(2,4):d,t=` Prod ${sd(p)} Exp ${sd(e)}`;
 return cat([27,77,1],n.slice(0,Math.max(4,42-t.length))+t+'\n',[27,77,0])};
// QR di kiri + 3 baris teks di kanan, dirender ke bitmap (GS v 0)
const rasterLbl=(b,u)=>{if(!window.qrcode)throw Error('Library QR gagal dimuat (cek internet)');
 const q=qrcode(0,'M');q.addData(u);q.make();
 const n=q.getModuleCount(),W=Math.max(192,(C.bpx||384)&~7),Q=2,cell=Math.max(2,Math.floor(Math.min(160,W*.42)/(n+2*Q))),qs=(n+2*Q)*cell,HH=qs+24,
 cv=document.createElement('canvas');cv.width=W;cv.height=HH;const g=cv.getContext('2d');
 g.fillStyle='#fff';g.fillRect(0,0,W,HH);g.fillStyle='#000';
 for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))g.fillRect((Q+c)*cell,(Q+r)*cell,cell,cell);
 const fit=(t,wt,mx,w)=>{let z=mx;g.font=`${wt} ${z}px sans-serif`;while(g.measureText(t).width>w&&z>12){z--;g.font=`${wt} ${z}px sans-serif`}return z};
 const x=qs+8,w=W-x-4,L=[[ASC(b.NamaProduk),'bold',30],['Prod '+b.TglProduksi,'normal',24],['Exp '+b.ExpDate,'bold',26]],
 Z=L.map(l=>fit(l[0],l[1],l[2],w)),tot=Z.reduce((a,z)=>a+z*1.35,0);let y=Math.max(0,(qs-tot)/2);
 g.textBaseline='top';g.textAlign='left';L.forEach((l,i)=>{g.font=`${l[1]} ${Z[i]}px sans-serif`;g.fillText(l[0],x,y);y+=Z[i]*1.35});
 const kz=fit(b.Kode,'normal',20,qs);g.font=`normal ${kz}px sans-serif`;g.textAlign='center';g.fillText(b.Kode,qs/2,qs+2);
 const px=g.getImageData(0,0,W,HH).data,wb=W/8,out=new Uint8Array(wb*HH);
 for(let r=0;r<HH;r++)for(let c=0;c<W;c++){const i=(r*W+c)*4;if(px[i+3]>128&&(px[i]*.3+px[i+1]*.59+px[i+2]*.11)<160)out[r*wb+(c>>3)]|=128>>(c&7)}
 return[29,118,48,0,wb&255,wb>>8,HH&255,HH>>8,...out]};
const lblBT=(b,m)=>{const k=b.Kode,u=(C.pub||(window.CONFIG&&CONFIG.PUBLIC_URL)||location.href.split('#')[0])+'#lacak='+k;
 if(m=='q')return cat(INIT,CTR,rasterLbl(b,u),FEED(3));
 if(m=='b')return cat(INIT,CTR,bcm(k),oneLine(b),FEED(3));
 return cat(INIT,CTR,BON,b.NamaProduk+'\n',BOFF,'Prod '+b.TglProduksi+'\n','Exp ',BON,b.ExpDate+'\n',BOFF,bcm(k),qrm(u),k+'\n',FEED(3))};
const strukBT=(b,bh)=>cat(INIT,CTR,BIG,BON,'CIBLE\n',NRM,BOFF,'Batch Produksi\n',LFT,DASH,
 row('Kode',b.Kode),row('Produk',b.NamaProduk),row('Produksi',b.TglProduksi),row('Exp',b.ExpDate),row('Status',b.Status),
 b.Operator?row('Operator',b.Operator):'',b.QtyJadi?row('Jadi / Reject',b.QtyJadi+' / '+(b.QtyReject||0)):'',DASH,'Bahan:\n',
 ...bh.map(x=>x.Nama+'\n'+row('  '+x.Qty+' '+x.Satuan,rp(x.Biaya))),DASH,
 ...(b.Status=='Selesai'?[row('Bahan',rp(b.BiayaBahan)),row('Tenaga kerja',rp(b.BiayaTK)),row('Overhead',rp(b.BiayaOverhead)),BON,row('TOTAL',rp(b.TotalBiaya)),BOFF,row('HPP / unit',rp(b.HPP)),DASH]:[]),
 CTR,'Dicetak '+new Date().toLocaleString('id-ID')+'\n',FEED(4));
const btLabel=k=>run(async()=>{const b=D.Produksi.find(x=>x.Kode==k),n=Math.min(+$('#ln').value||1,100),d=lblBT(b,$('#lm').value);await BT.conn();for(let i=0;i<n;i++)await BT.send(d);toast(n+' label terkirim ke printer')});
const btStruk=k=>run(async()=>{const b=D.Produksi.find(x=>x.Kode==k);await BT.send(strukBT(b,D.ProduksiBahan.filter(x=>x.Kode==k)));toast('Struk terkirim ke printer')});
const btConn=()=>run(async()=>{await BT.conn(true);toast('Terhubung: '+(BT.dev.name||'printer'));if(T=='set')V.set()});
const btTest=()=>run(async()=>{await BT.send(cat(INIT,CTR,BIG,BON,'TES PRINTER\n',NRM,BOFF,'Bluetooth OK\n',FEED(4)));toast('Tes terkirim')});
// ---------- PWA
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.ip=e;if(T=='set'&&sessionStorage.ok)V.set()});
addEventListener('appinstalled',()=>{S.ip=null;toast('Aplikasi terpasang');if(T=='set'&&sessionStorage.ok)V.set()});
const pasang=async()=>{if(!S.ip)return;S.ip.prompt();await S.ip.userChoice;S.ip=null;V.set()};
// ---------- Start
const m=location.hash.match(/lacak=([^&]+)/);
if(m&&!sessionStorage.ok&&URL_()){fetch(URL_()+'?action=prod.lacak&kode='+m[1]).then(r=>r.json()).then(j=>{$('#app').innerHTML=`<main style="max-width:420px"><div class=card><h3>${j.ok?H(j.data.NamaProduk):'Tidak ditemukan'}</h3>${j.ok?`Kode produksi: <b>${H(j.data.Kode)}</b><br>Tanggal produksi: ${j.data.TglProduksi}<br>Kedaluwarsa: <b>${j.data.ExpDate}</b><br>Jumlah batch: ${j.data.QtyJadi||'-'}`:H(j.error)}<p><a href="#" onclick="location.hash='';location.reload()">Masuk staf</a></p></div></main>`})}
else if(sessionStorage.ok){go('home').then(()=>m&&det(decodeURIComponent(m[1])))}else login();
</script></body></html>
