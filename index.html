<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CIBLE Produksi</title>
<style id="ps"></style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Material+Symbols+Outlined&display=swap">
<style>
:root{--p:#6750A4;--pc:#EADDFF;--opc:#21005D;--sc:#E8DEF8;--osc:#1D192B;--bg:#FEF7FF;--sf:#F3EDF7;--sf2:#ECE6F0;--tx:#1D1B20;--tx2:#49454F;--ol:#79747E;--olv:#CAC4D0;--er:#B3261E}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/20px Roboto,system-ui,sans-serif;padding-bottom:88px}
.ms{font-family:'Material Symbols Outlined';font-weight:400;font-size:24px;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;font-feature-settings:'liga'}
header{position:sticky;top:0;z-index:5;height:64px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;font:400 22px/28px Roboto,system-ui}
.ib{width:48px;height:48px;border-radius:24px;display:grid;place-items:center;cursor:pointer;color:var(--tx2)}.ib:hover{background:var(--sf2)}
nav{position:fixed;z-index:6;left:0;right:0;bottom:0;height:80px;background:var(--sf);display:flex}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0 16px;cursor:pointer;font:500 12px/16px Roboto,system-ui;color:var(--tx2)}
nav a i{width:64px;height:32px;border-radius:16px;display:grid;place-items:center}nav a.on{color:var(--tx)}nav a.on i{background:var(--sc)}
main{max-width:840px;margin:0 auto;padding:8px 16px 24px}h3{font:400 22px/28px Roboto,system-ui;margin:0 0 8px}
label{display:block;margin:12px 0;font:500 12px/16px Roboto,system-ui;color:var(--tx2)}
input,select{display:block;width:100%;height:48px;margin-top:4px;padding:0 14px;border:1px solid var(--ol);border-radius:4px;background:transparent;color:var(--tx);font:400 16px Roboto,system-ui}
input:focus,select:focus{outline:2px solid var(--p);outline-offset:-2px;border-color:transparent}td input{height:36px;min-width:72px;margin:0;font-size:14px}
button{height:40px;padding:0 24px;margin:8px 8px 8px 0;border:0;border-radius:20px;background:var(--p);color:#fff;font:500 14px Roboto,system-ui;cursor:pointer}
button.g{background:var(--sc);color:var(--osc)}button.r{background:transparent;color:var(--er);border:1px solid var(--ol)}button.t{background:transparent;color:var(--p);padding:0 12px;margin:0}
button:focus-visible,nav a:focus-visible,.fab:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.card{background:var(--sf);border-radius:12px;padding:16px;margin:12px 0}.w{color:var(--er)}.row{display:flex;gap:12px}.row>*{flex:1}
table{width:100%;border-collapse:collapse}th{font:500 12px Roboto,system-ui;color:var(--tx2)}td,th{padding:10px 8px;border-bottom:1px solid var(--olv);text-align:left}
.li{display:flex;align-items:center;gap:16px;min-height:72px;padding:8px 16px;border-bottom:1px solid var(--olv);cursor:pointer}.li:hover{background:var(--sf)}.li>div:first-child{flex:1;min-width:0}.li b{display:block;font:400 16px/24px Roboto,system-ui}.li small{color:var(--tx2)}
.chip{display:inline-block;height:24px;padding:0 10px;border-radius:8px;font:500 12px/24px Roboto,system-ui;background:var(--sf2)}.Proses{background:#FFDEA8;color:#3B2A00}.Selesai{background:#C4EED0;color:#00210E}.Batal{background:var(--sf2);color:var(--tx2)}
.fab{position:fixed;right:16px;bottom:96px;z-index:4;height:56px;padding:0 20px 0 16px;border-radius:16px;background:var(--pc);color:var(--opc);display:flex;align-items:center;gap:12px;font:500 14px Roboto,system-ui;box-shadow:0 3px 8px rgba(0,0,0,.25);cursor:pointer}
#toast{position:fixed;left:16px;right:16px;bottom:96px;max-width:560px;margin:auto;background:#322F35;color:#F5EFF7;padding:14px 16px;border-radius:4px;display:none;z-index:20}
dialog{border:0;border-radius:28px;background:var(--bg);padding:24px;width:min(560px,92vw);color:var(--tx)}dialog::backdrop{background:rgba(0,0,0,.32)}.act{display:flex;justify-content:flex-end;gap:8px}
@media(min-width:840px){body{padding:0 0 0 80px}nav{top:0;right:auto;width:80px;height:auto;flex-direction:column;padding-top:44px}nav a{flex:none}.fab{bottom:24px}#toast{bottom:24px}}
#pr{display:none}.lb{overflow:hidden;padding:1.5mm;font:8px/1.2 sans-serif;page-break-after:always;position:relative}.lb svg.bc{width:60%;height:9mm}.lb .qr{position:absolute;right:1.5mm;bottom:1.5mm;width:11mm}.lb .qr svg{width:100%;height:auto}
@media print{body{padding:0!important}body>*:not(#pr){display:none!important}#pr{display:block}}
</style></head><body>
<div id="app"></div><div id="pr"></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const DEFAULT_URL=''; // isi URL web app Apps Script (agar QR label bisa dibuka pelanggan)
const $=s=>document.querySelector(s),H=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C=JSON.parse(localStorage.cible_prod||'{}'),save=()=>localStorage.cible_prod=JSON.stringify(C),URL_=()=>C.url||DEFAULT_URL;
const rp=n=>'Rp '+Math.round(+n||0).toLocaleString('id-ID'),today=()=>new Date().toLocaleDateString('sv-SE'),B=id=>D.Barang.find(x=>x.ID==id)||{};
let D={Produk:[],Barang:[],Resep:[],Produksi:[],ProduksiBahan:[]},T='batch',S={},R={};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
async function api(a,d){if(!URL_())throw Error('Isi URL Apps Script di menu Setelan.');
 const r=await fetch(URL_(),{method:'POST',body:JSON.stringify({action:a,pin:C.pin||'',data:d||{}})}),j=await r.json();if(!j.ok)throw Error(j.error);return j.data}
async function run(f){try{return await f()}catch(e){toast(e.message)}}
const load=async()=>{D=await api('prod.data')};
const TT={batch:'Batch produksi',resep:'Resep',bahan:'Bahan & kemasan',scan:'Scan',set:'Setelan'},IC={batch:'factory',resep:'menu_book',bahan:'inventory_2',scan:'qr_code_scanner',set:'settings'},NM={batch:'Batch',resep:'Resep',bahan:'Bahan',scan:'Scan',set:'Setelan'};
function shell(h){$('#app').innerHTML=`<header><span>${TT[T]}</span><a class=ib title="Keluar" onclick="sessionStorage.clear();location.reload()"><i class=ms>logout</i></a></header><main>${h}</main><nav>${Object.keys(NM).map(k=>`<a class="${T==k?'on':''}" onclick="go('${k}')"><i class=ms>${IC[k]}</i>${NM[k]}</a>`).join('')}</nav>`}
function ask(t,f){return new Promise(res=>{const d=document.createElement('dialog');d.innerHTML=`<h3>${t}</h3><form method=dialog>${f.map((x,i)=>`<label>${x[0]}<input name=f${i} value="${H(x[1]||'')}" ${x[2]||''}></label>`).join('')}<div class=act><button class=t value=x>Batal</button><button value=ok>Simpan</button></div></form>`;document.body.append(d);d.onclose=()=>{res(d.returnValue=='ok'?f.map((x,i)=>d.querySelector(`[name=f${i}]`).value):null);d.remove()};d.showModal()})}
async function go(t){T=t;if(t!='set')await run(load);V[t]()}
// ---------- Login
function login(){$('#app').innerHTML=`<main style="max-width:340px;margin-top:12vh"><div class=card><h3>Masuk ke CIBLE Produksi</h3><label>Username<input id=lu autocomplete=username></label><label>Password<input id=lp type=password autocomplete=current-password onkeydown="if(event.key=='Enter')masuk()"></label><button onclick=masuk()>Masuk</button></div></main>`}
function masuk(){if($('#lu').value.trim()=='admin'&&$('#lp').value=='1234'){sessionStorage.ok=1;go('batch')}else toast('Username atau password salah')}
// ---------- Views
const V={};
V.batch=()=>shell(`${D.Produksi.length?[...D.Produksi].reverse().map(b=>`<div class=li onclick="det('${b.Kode}')"><div><b>${H(b.NamaProduk)}</b><small>${b.Kode} · ${b.TglProduksi}</small></div><div style="text-align:right"><span class="chip ${b.Status}">${b.Status}</span>${b.HPP?`<br><small>HPP ${rp(b.HPP)}</small>`:''}</div></div>`).join(''):'<p class=card>Belum ada batch. Tekan Batch baru untuk memulai.</p>'}<a class=fab onclick=baru()><i class=ms>add</i>Batch baru</a>`);
function baru(){shell(`<div class=card><h3>Batch baru</h3><label>Produk<select id=bp onchange=hit()>${D.Produk.map(p=>`<option value="${H(p.Kode)}">${H(p.Kode)} - ${H(p.Nama)}</option>`)}</select></label><div class=row><label>Jumlah rencana (unit)<input id=bq type=number value=10 oninput=hit()></label><label>Tanggal produksi<input id=bt type=date value="${today()}"></label></div><label>Operator<input id=bo></label><div id=bi></div><button onclick=mulai()>Mulai &amp; ambil bahan</button><button class=g onclick="go('batch')">Batal</button></div>`);hit()}
function hit(){const r=D.Resep.find(x=>x.KodeProduk==$('#bp').value),q=+$('#bq').value||0;
 if(!r){S.it=[];$('#bi').innerHTML='<p class=w>Resep produk ini belum dibuat (menu Resep).</p>';return}
 const f=q/(+r.YieldStandar||1);S.r=r;S.it=JSON.parse(r.Item||'[]').map(i=>({...i,q:+(i.Basis=='Unit'?i.Qty*q:i.Qty*f).toFixed(3)}));
 $('#bi').innerHTML=`<table><tr><th>Bahan</th><th>Ambil</th><th>Stok</th><th>Est. biaya</th></tr>${S.it.map((i,k)=>{const b=B(i.BarangID);return`<tr><td>${H(i.Nama)}</td><td><input id=q${k} type=number step=any value=${i.q}> ${H(i.Satuan)}</td><td class="${b.Jumlah<i.q?'w':''}">${b.Jumlah??'?'}</td><td>${rp(i.q*b.HargaSatuan)}</td></tr>`}).join('')}</table>`}
const mulai=()=>run(async()=>{const r=await api('prod.mulai',{KodeProduk:$('#bp').value,QtyRencana:$('#bq').value,TglProduksi:$('#bt').value,Operator:$('#bo').value,Items:S.it.map((i,k)=>({BarangID:i.BarangID,Qty:$('#q'+k).value}))});toast('Batch '+r.Kode+' dimulai');await load();det(r.Kode)});
function det(k){const b=D.Produksi.find(x=>x.Kode==k);if(!b)return toast('Kode tidak ditemukan');const bh=D.ProduksiBahan.filter(x=>x.Kode==k),p=D.Produk.find(x=>x.Kode==b.KodeProduk)||{},r=D.Resep.find(x=>x.KodeProduk==b.KodeProduk)||{};
 const fin=b.Status=='Proses'?`<div class=card><h3>Selesaikan batch</h3><div class=row><label>Jumlah jadi<input id=fj type=number step=any value=${b.QtyRencana}></label><label>Reject<input id=fr type=number value=0></label></div><div class=row><label>Biaya tenaga kerja<input id=ft type=number value=${r.BiayaTK||0}></label><label>Overhead<input id=fo type=number value=${r.BiayaOverhead||0}></label></div><label>Exp date<input id=fe type=date value="${b.ExpDate}"></label><p>Isi sisa bahan yang dikembalikan ke persediaan pada kolom Kembali.</p><button onclick="selesai('${k}')">Simpan hasil &amp; hitung HPP</button></div>`:'';
 const hpp=b.Status=='Selesai'?`<div class=card>Bahan ${rp(b.BiayaBahan)} + TK ${rp(b.BiayaTK)} + Overhead ${rp(b.BiayaOverhead)} = <b>${rp(b.TotalBiaya)}</b><br>HPP per unit: <b>${rp(b.HPP)}</b>${p.Harga?` · Harga jual ${rp(p.Harga)} · Margin ${Math.round((p.Harga-b.HPP)/p.Harga*100)}%`:''}</div><div class=card><h3>Label</h3><div class=row><label>Jumlah label<input id=ln type=number value=${b.QtyJadi}></label><label>Isi<select id=lm><option value=b>Barcode + QR</option><option value=q>QR saja</option></select></label></div><button onclick="cetak('${k}')">Cetak label</button></div>`:'';
 shell(`<button class=g onclick="go('batch')">‹ Kembali</button><div class=card><h3>${b.Kode} <span class="chip ${b.Status}">${b.Status}</span></h3>${H(b.NamaProduk)}<br>Produksi ${b.TglProduksi} · Exp ${b.ExpDate} · Rencana ${b.QtyRencana}${b.QtyJadi?` · Jadi ${b.QtyJadi} · Reject ${b.QtyReject}`:''}${b.Operator?' · '+H(b.Operator):''}</div>
 <table><tr><th>Bahan</th><th>Diambil</th><th>Kembali</th><th>Harga</th><th>Biaya</th></tr>${bh.map(x=>`<tr><td>${H(x.Nama)}</td><td>${x.Qty} ${H(x.Satuan)}</td><td>${b.Status=='Proses'?`<input class=kb data-id="${x.BarangID}" type=number step=any value=0>`:x.Kembali}</td><td>${rp(x.HargaSatuan)}</td><td>${rp(x.Biaya)}</td></tr>`).join('')}</table>${fin}${hpp}${b.Status!='Batal'?`<button class=r onclick="batal('${k}')">Batalkan batch</button>`:''}`)}
const selesai=k=>run(async()=>{await api('prod.selesai',{Kode:k,QtyJadi:$('#fj').value,QtyReject:$('#fr').value,BiayaTK:$('#ft').value,BiayaOverhead:$('#fo').value,ExpDate:$('#fe').value,Kembali:[...document.querySelectorAll('.kb')].map(i=>({BarangID:i.dataset.id,Kembali:i.value}))});await load();toast('Batch selesai, stok produk bertambah');det(k)});
const batal=k=>confirm('Batalkan batch '+k+'? Bahan dikembalikan ke persediaan.')&&run(async()=>{await api('prod.batal',{Kode:k});await load();det(k)});
function cetak(k){const b=D.Produksi.find(x=>x.Kode==k),n=Math.min(+$('#ln').value||1,500),m=$('#lm').value,w=C.lw||50,h=C.lh||30,u=(C.pub||location.href.split('#')[0])+'#lacak='+k;
 $('#ps').textContent=`@page{size:${w}mm ${h}mm;margin:0}.lb{width:${w}mm;height:${h}mm}`;
 $('#pr').innerHTML=Array(n).fill(`<div class=lb><b style="font-size:9px">${H(b.NamaProduk)}</b><br>Prod ${b.TglProduksi}<br>Exp <b>${b.ExpDate}</b><br>${m=='b'?'<svg class=bc></svg><br>':''}${b.Kode}<div class=qr></div></div>`).join('');
 if(m=='b'&&window.JsBarcode)document.querySelectorAll('.bc').forEach(s=>JsBarcode(s,k,{format:'CODE128',height:30,displayValue:false,margin:0,width:1.3}));
 if(window.qrcode){const q=qrcode(0,'M');q.addData(u);q.make();document.querySelectorAll('.qr').forEach(e=>e.innerHTML=q.createSvgTag(2,0))}else toast('Library QR gagal dimuat (cek internet)');
 setTimeout(()=>print(),200)}
V.resep=()=>{if(!R.k)R.k=(D.Produk[0]||{}).Kode;const r=D.Resep.find(x=>x.KodeProduk==R.k)||{};if(R.loaded!=R.k){R.items=JSON.parse(r.Item||'[]');R.loaded=R.k}
 shell(`<div class=card><label>Produk<select onchange="R.k=this.value;V.resep()">${D.Produk.map(p=>`<option value="${H(p.Kode)}" ${p.Kode==R.k?'selected':''}>${H(p.Kode)} - ${H(p.Nama)}</option>`)}</select></label>
 <div class=row><label>Umur simpan (hari)<input id=ru type=number value=${r.UmurSimpanHari||30}></label><label>Hasil standar / batch (unit)<input id=ry type=number value=${r.YieldStandar||10}></label></div>
 <div class=row><label>Biaya tenaga kerja / batch<input id=rt type=number value=${r.BiayaTK||0}></label><label>Overhead / batch<input id=ro type=number value=${r.BiayaOverhead||0}></label></div>
 <table><tr><th>Bahan / kemasan</th><th>Jumlah</th><th>Dihitung</th><th></th></tr>${R.items.map((i,k)=>`<tr><td>${H(i.Nama)}</td><td><input type=number step=any value=${i.Qty} onchange="R.items[${k}].Qty=+this.value"> ${H(i.Satuan)}</td><td><select onchange="R.items[${k}].Basis=this.value"><option value=Batch ${i.Basis!='Unit'?'selected':''}>per batch</option><option value=Unit ${i.Basis=='Unit'?'selected':''}>per unit jadi</option></select></td><td><a onclick="R.items.splice(${k},1);V.resep()">✕</a></td></tr>`).join('')}</table>
 <label>Tambah item<select id=ri onchange="tambahItem()"><option value="">- pilih -</option>${D.Barang.map(b=>`<option value="${b.ID}">${H(b.Kategori)}: ${H(b.Nama)}</option>`)}</select></label><button onclick=simpanResep()>Simpan resep</button></div>`)};
function tambahItem(){const b=B($('#ri').value);if(!b.ID)return;R.items.push({BarangID:b.ID,Nama:b.Nama,Satuan:b.Satuan,Qty:1,Basis:b.Kategori=='Kemasan'?'Unit':'Batch'});V.resep()}
const simpanResep=()=>run(async()=>{await api('prod.simpanResep',{KodeProduk:R.k,UmurSimpanHari:$('#ru').value,YieldStandar:$('#ry').value,BiayaTK:$('#rt').value,BiayaOverhead:$('#ro').value,Item:R.items});R.loaded=null;await load();toast('Resep tersimpan');V.resep()});
V.bahan=()=>shell(`${D.Barang.filter(b=>b.Kategori!='Produk Jadi').map(b=>`<div class=li><div><b>${H(b.Nama)}</b><small>${H(b.Kategori)} · stok ${b.Jumlah} ${H(b.Satuan)} · ${rp(b.HargaSatuan)}</small></div><button class=t onclick="terima('${b.ID}')">Terima</button></div>`).join('')}<a class=fab onclick=barangBaru()><i class=ms>add</i>Barang baru</a>`);
const terima=async id=>{const b=B(id),v=await ask('Terima '+H(b.Nama),[['Jumlah ('+b.Satuan+')','','type=number step=any'],['Harga beli per '+b.Satuan+' (Rp)','','type=number']]);if(v)run(async()=>{await api('prod.terimaBahan',{ID:id,Qty:v[0],Harga:v[1]});await load();V.bahan();toast('Stok diperbarui (harga rata-rata tertimbang)')})};
const barangBaru=async()=>{const v=await ask('Barang baru',[['Nama'],['Kategori (Bahan Baku, Bahan Pembantu, Kemasan)','Bahan Baku'],['Satuan','kg']]);if(v)run(async()=>{await api('saveBarang',{Nama:v[0],Kategori:v[1],Satuan:v[2],Jumlah:0,HargaSatuan:0});await load();V.bahan()})};
V.scan=()=>shell(`<div class=card><label>Scan barcode atau ketik kode produksi<input id=sk onkeydown="if(event.key=='Enter')det(this.value.trim())" autofocus></label><button onclick="det($('#sk').value.trim())">Cari</button>${window.BarcodeDetector?'<button class=g onclick=kam()>Kamera</button>':''}<video id=vd hidden playsinline style="width:100%"></video></div>`);
async function kam(){const v=$('#vd'),st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}),d=new BarcodeDetector();v.hidden=false;v.srcObject=st;await v.play();
 const t=setInterval(async()=>{const r=await d.detect(v).catch(()=>[]);if(r.length){clearInterval(t);st.getTracks().forEach(x=>x.stop());let c=r[0].rawValue;const m=c.match(/lacak=([^&]+)/);det(m?decodeURIComponent(m[1]):c)}},400)}
V.set=()=>shell(`<div class=card><h3>Setelan</h3><label>URL web app Apps Script<input id=su value="${H(URL_())}"></label><label>PIN aplikasi (APP_PIN)<input id=sp type=password value="${H(C.pin||'')}"></label><div class=row><label>Lebar label (mm)<input id=sw type=number value=${C.lw||50}></label><label>Tinggi label (mm)<input id=sh type=number value=${C.lh||30}></label></div><label>URL publik aplikasi ini (untuk isi QR)<input id=sb placeholder="https://..." value="${H(C.pub||'')}"></label><button onclick=simpanSet()>Simpan</button></div>`);
function simpanSet(){Object.assign(C,{url:$('#su').value.trim(),pin:$('#sp').value,lw:+$('#sw').value,lh:+$('#sh').value,pub:$('#sb').value.trim()});save();toast('Tersimpan')}
// ---------- Start
const m=location.hash.match(/lacak=([^&]+)/);
if(m&&!sessionStorage.ok&&URL_()){fetch(URL_()+'?action=prod.lacak&kode='+m[1]).then(r=>r.json()).then(j=>{$('#app').innerHTML=`<main style="max-width:420px"><div class=card><h3>${j.ok?H(j.data.NamaProduk):'Tidak ditemukan'}</h3>${j.ok?`Kode produksi: <b>${H(j.data.Kode)}</b><br>Tanggal produksi: ${j.data.TglProduksi}<br>Kedaluwarsa: <b>${j.data.ExpDate}</b><br>Jumlah batch: ${j.data.QtyJadi||'-'}`:H(j.error)}<p><a href="#" onclick="location.hash='';location.reload()">Masuk staf</a></p></div></main>`})}
else if(sessionStorage.ok){go('batch').then(()=>m&&det(decodeURIComponent(m[1])))}else login();
</script></body></html>
